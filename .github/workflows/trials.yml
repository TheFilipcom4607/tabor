name: Look for buses on trial and new numbers

# Also, in the same run and from the same feeds: any bus or tram running with a number fleet.json
# doesn't have at all (scripts/new_numbers.py), in the issue "Nowe numery na mapie". A new
# delivery runs on the street days or weeks before the city's list carries it, so this is the
# earliest sign of one. Same rules: listed until its last sighting is a week old, "Nowe:" when a
# number joins, closed when nothing is left.

# Buses on trial never reach the city's list. Warsaw numbers them 9xx, so scripts/trial_buses.py
# lists every 9xx the live feed has seen in the last week that fleet.json doesn't have yet ("?")
# in the issue "Autobusy na testach" — the to-do list for TEST_BUSES. The feed forgets a vehicle
# a few hours after its last report (a trial bus parks overnight), so the script also gets the
# issue's current body and keeps each bus listed until its last sighting is a week old: the list
# no longer flickers with the service day, and "Nowe:" fires only when a number joins it. It
# used to run once a night in fleet.yml, which missed a trial bus whose GPS came on in the day
# (#956 on 16 Nov 2026); hourly, a new bus shows within the hour. One call to the feed, one
# issue read and one edit an hour, through the day only: trial buses run in service hours.
# Each bus comes with what czynaczas.pl knows of it (make, model, year, his special entry and
# its dates), read from the Worker, which the nightly fleet run fills: his API is asked once a
# night, never hourly.
on:
  schedule:
    # 05:23-23:23 in Warsaw in winter, 06:23-00:23 in summer (cron is UTC). Off the hour: GitHub
    # delays runs scheduled for :00.
    - cron: "23 4-22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: trials
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TRIALS_TITLE: "Autobusy na testach"
  NEW_TITLE: "Nowe numery na mapie"

jobs:
  trials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            scripts/trial_buses.py
            scripts/new_numbers.py
            scripts/czynaczas.py
            scripts/phototrans.py
            Tabor/Resources/fleet.json
          sparse-checkout-cone-mode: false

      # Without it the issue just goes without his names and dates.
      - name: Get czynaczas.pl's names for them
        continue-on-error: true
        env:
          ROUTES_UPLOAD_TOKEN: ${{ secrets.ROUTES_UPLOAD_TOKEN }}
        run: python3 scripts/czynaczas.py hints "$RUNNER_TEMP/czynaczas.json"

      # A feed that can't be read leaves no marker, so the issue is left as it is.
      - name: Look for buses on trial in the live feed
        continue-on-error: true
        run: |
          number=$(gh issue list --state open --search "in:title \"$TRIALS_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TRIALS_TITLE\")) | .[0].number // empty" || true)
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body > previous.md 2>/dev/null || rm -f previous.md
          fi
          python3 scripts/trial_buses.py trials.md previous.md --czynaczas "$RUNNER_TEMP/czynaczas.json"
          touch trials-checked

      # A trial can be over in a few weeks, so a bus that joins an open issue gets a comment
      # (which notifies) as well as the silent edit. Editing an issue's text sends no
      # notification, so the list stays current without pinging anyone every hour: only a new
      # bus or opening it does. The edit is skipped when nothing in the list changed.
      - name: Open, update or close the trials issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f trials-checked ]; then
            echo "The live feed couldn't be read; leaving the issue as it is."
            exit 0
          fi
          number=$(gh issue list --state open --search "in:title \"$TRIALS_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TRIALS_TITLE\")) | .[0].number // empty")
          if [ -f trials.md ]; then
            if [ -n "$number" ]; then
              body=$(gh issue view "$number" --json body --jq .body)
              buses() { grep -o '^| #9[0-9][0-9]' | sed 's/^| //' | sort || true; }
              added=$(comm -13 <(buses <<< "$body") <(buses < trials.md) | paste -sd ' ' -)
              [ "$body" = "$(cat trials.md)" ] || gh issue edit "$number" --body-file trials.md
              # "Nowe: #960 (Solaris Urbino 10.5 electric)", the model from the bus's own row.
              named=$(for n in $added; do
                m=$(grep "^| $n |" trials.md | cut -d'|' -f3 | sed 's/^ *//; s/ *$//')
                [ -z "$m" ] || [ "$m" = "?" ] && echo "$n" || echo "$n ($m)"
              done | paste -sd ';' - | sed 's/;/, /g')
              [ -z "$added" ] || gh issue comment "$number" --body "Nowe: $named"
            else
              gh issue create --title "$TRIALS_TITLE" --body-file trials.md --label BOT
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --reason completed --comment "Nic nie zostało."
          fi

      - name: Look for new numbers on the live feed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$NEW_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$NEW_TITLE\")) | .[0].number // empty" || true)
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body > previous-new.md 2>/dev/null || rm -f previous-new.md
          fi
          python3 scripts/new_numbers.py new.md previous-new.md --czynaczas "$RUNNER_TEMP/czynaczas.json"
          touch new-checked

      # As for trials: a comment only when a number joins, a silent edit otherwise.
      - name: Open, update or close the new-numbers issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f new-checked ]; then
            echo "The live feed couldn't be read; leaving the issue as it is."
            exit 0
          fi
          number=$(gh issue list --state open --search "in:title \"$NEW_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$NEW_TITLE\")) | .[0].number // empty")
          if [ -f new.md ]; then
            if [ -n "$number" ]; then
              body=$(gh issue view "$number" --json body --jq .body)
              vehicles() { grep -oE '^\| (BUS|TRAM) #[0-9]+' | sed 's/^| //' | sort || true; }
              added=$(comm -13 <(vehicles <<< "$body") <(vehicles < new.md))
              [ "$body" = "$(cat new.md)" ] || gh issue edit "$number" --body-file new.md
              if [ -n "$added" ]; then
                # "Nowe: BUS #9055 (Otokar Vectio C, 2026)", his name from the vehicle's own row.
                named=$(while read -r v; do
                  m=$(grep "^| $v |" new.md | cut -d'|' -f3 | sed 's/^ *//; s/ *$//')
                  [ -z "$m" ] && echo "$v" || echo "$v ($m)"
                done <<< "$added" | paste -sd ';' - | sed 's/;/, /g')
                gh issue comment "$number" --body "Nowe: $named"
              fi
            else
              gh issue create --title "$NEW_TITLE" --body-file new.md --label BOT
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --reason completed --comment "Nic nie zostało."
          fi
