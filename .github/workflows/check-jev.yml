name: Check Jev

# By hand: asks Jev about MZA posts whose answer is known (possible_wraps.py's LABELLED) and
# fails if it would drop a wrap. Run it after changing the question, WRAP_ODDS or JEV_MODEL.
# The OpenRouter key is a repo secret, so this can't be checked anywhere else without it.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask Jev about the labelled posts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/possible_wraps.py --check
