# The live-feed proxy (see src/index.js). Deploy from this folder:
#   npx wrangler login
#   npx wrangler secret put DANE_TOKEN # the dane.um.warszawa.pl token (dane.um.warszawa.pl/en/key-api)
#   npx wrangler secret put UM_KEY     # the old api.um.warszawa.pl key, until the city switches it off
#   npx wrangler secret put ROUTES_UPLOAD_TOKEN  # what the routes Action sends to PUT /v1/routes
#   npx wrangler secret put APNS_KEY   # the .p8 APNs auth key, for Live Activity pushes (track.js)
#   npx wrangler secret put STATS_SECRET  # any long random string, kept nowhere else (stats.js)
#   npx wrangler deploy
name = "tabor-live"
main = "src/index.js"
compatibility_date = "2026-09-01"
# One public address: the custom domain. workers.dev stays off.
workers_dev = false
routes = [{ pattern = "taborapi.thefilip.com", custom_domain = true }]

# Run next to the city's servers (GCP europe-central2 is Warsaw): ZTM drops connections from
# abroad (a 522 from Newark, 2026-09-28), which is where GitHub's runners reach Cloudflare,
# and phones in Warsaw lose nothing by it.
[placement]
region = "gcp:europe-central2"

[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# The fleet lookup for other projects (src/lookup.js), kept apart from the app's limit.
[[ratelimits]]
name = "LOOKUP_PER_IP"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# czynaczas.pl remarks (src/czynaczas.js): one vehicle at a time, so a script can't take them
# all in a few minutes. Opening vehicle pages one after another stays well under it.
[[ratelimits]]
name = "REMARKS_PER_IP"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# routes.json for HUNT's future trails (src/routes.js), and czynaczas.pl's remarks
# (src/czynaczas.js). KV, not R2: a few small writes a day.
[[kv_namespaces]]
binding = "ROUTES"
id = "197432fc70f44a5692736b7762d8eb60"

# Requests, errors and timings in the dashboard (Observability tab). Kept 7 days on Workers Paid.
[observability.logs]
enabled = true
invocation_logs = true

# Live Activities (track.js): one Durable Object holds every followed vehicle and polls the
# feed for all of them. SQLite-backed, which the free plan allows.
[[durable_objects.bindings]]
name = "TRACKER"
class_name = "Tracker"

# Phones a day and their builds (src/stats.js), with a tag that changes daily and keeps no IP.
# Free plan: 100,000 rows written and 10,000 queries a day. Read it with scripts/app_stats.sh.
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "tabor_stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tracker"]

# Not secret: the APNs key's ID and the team it belongs to.
[vars]
APNS_KEY_ID = "GA9ARZQR96"
APNS_TEAM_ID = "4FGGTM5838"
